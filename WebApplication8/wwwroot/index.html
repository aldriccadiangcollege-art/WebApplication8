<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Products</title>
</head>
<body>
    <h2>Products</h2>
    <p>Logged in as: <b id="who">(nobody)</b> <button id="logout">Logout</button></p>

    <h3>Register / Login</h3>
    <input id="u" placeholder="username"> <input id="p" type="password" placeholder="password">
    <button id="reg">Register</button> <button id="log">Login</button>
    <pre id="msg"></pre>

    <h3>Add product (admin)</h3>
    <input id="pname" placeholder="name"> <input id="pprice" placeholder="price" type="number">
    <button id="add">Add</button>

    <h3>List</h3>
    <button id="load">Load products</button>
    <ul id="list"></ul>

    <script>
const API = "/api";
const $ = id => document.getElementById(id);
const show = t => $("msg").textContent = t;

function refreshWho() { $("who").textContent = localStorage.getItem("username") || "(nobody)"; }

async function authFetch(url, options = {}) {
  const token = localStorage.getItem("token");
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (token) headers["Authorization"] = "Bearer " + token;
  return fetch(url, { ...options, headers });
}

$("reg").onclick = async () => {
  const r = await fetch(API + "/Auth/register", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("u").value, password: $("p").value })
  });
  show(`Register -> ${r.status}\n` + await r.text());
};

$("log").onclick = async () => {
  const r = await fetch(API + "/Auth/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("u").value, password: $("p").value })
  });
  if (r.ok) {
    const d = await r.json();
    localStorage.setItem("token", d.token);
    localStorage.setItem("username", d.username);
    show(`Login -> ${r.status} (token saved)`);
  } else show(`Login -> ${r.status}\n` + await r.text());
  refreshWho();
};

$("logout").onclick = () => { localStorage.removeItem("token"); localStorage.removeItem("username"); refreshWho(); show("Logged out"); };

$("add").onclick = async () => {
  const r = await authFetch(API + "/Product", {
    method: "POST",
    body: JSON.stringify({ name: $("pname").value, price: Number($("pprice").value) })
  });
  show(`Add product -> ${r.status}`);
  if (r.ok) $("load").click();
};

$("load").onclick = async () => {
  const r = await fetch(API + "/Product");          // GET is open
  const data = await r.json();
  const items = data.data ?? data;                   // handles your paged envelope
  $("list").innerHTML = "";
  items.forEach(p => {
    const li = document.createElement("li");
    li.textContent = `${p.id}: ${p.name} - ${p.price} `;
    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = async () => {
      const dr = await authFetch(API + "/Product/" + p.id, { method: "DELETE" });
      show(`Delete -> ${dr.status}`);
      $("load").click();
    };
    li.appendChild(del);
    $("list").appendChild(li);
  });
};
refreshWho();
    </script>
</body>
</html>
